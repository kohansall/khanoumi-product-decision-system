<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>داشبورد VOC خانومی</title><style>body{font-family:Tahoma;background:#fff7fb;color:#2b1830;margin:0}main{max-width:1100px;margin:auto;padding:28px}.hero,.card{background:white;border:1px solid #f0cfe0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #7d315018}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi b{font-size:28px;color:#d93679}input,select,button{padding:10px;border:1px solid #d8afc2;border-radius:10px;margin:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:right}.bar{height:12px;background:#ed4d90;border-radius:8px}small{color:#765b68}</style><main><section class="hero"><h1>داشبورد تعاملی صدای مشتری خانومی</h1><p>Dataset canonical و anonymized · ۳۹٬۷۳۷ ردیف · نام و شناسه شخصی حذف شده</p><small>کامنت‌ها self-selected هستند و نماینده شیوع در کل کاربران نیستند.</small></section><section class="kpis"><div class="card kpi"><b id="count">39,737</b><div>کل رکوردها</div></div><div class="card kpi"><b>21,922</b><div>مثبت</div></div><div class="card kpi"><b>3,257</b><div>منفی</div></div></section><section class="card"><h2>Themeهای پرتکرار</h2><div id="themes"></div></section><section class="card"><h2>کاوش داده</h2><input id="q" placeholder="جست‌وجو در متن"><select id="s"><option value="">همه احساس‌ها</option><option>خنثی</option><option>مثبت</option><option>ترکیبی</option><option>منفی</option></select><button onclick="filterRows()">اعمال</button><div style="overflow:auto"><table><thead><tr><th>محصول</th><th>متن</th><th>احساس</th><th>دسته اصلی</th></tr></thead><tbody id="body"></tbody></table></div></section></main><script>const META={"rows": 39737, "sentiment": {"خنثی": 13928, "مثبت": 21922, "ترکیبی": 630, "منفی": 3257}, "themes": [["رضایت کلی", 7976], ["تجربه محصول", 7081], ["بو و رایحه", 3751], ["حساسیت و واکنش پوست/مو", 3303], ["موجودی کالا", 2721], ["رنگ و شید", 2054], ["تخفیف", 1755], ["قیمت", 1436], ["اثربخشی", 1434], ["بافت محصول", 1325], ["کیفیت محصول", 1282], ["حجم و مقدار", 663], ["ارسال کالا", 639], ["نارضایتی کلی", 636], ["نیاز به مشاوره", 553], ["ماندگاری", 521], ["اصالت کالا", 418], ["ترکیبات", 336], ["سایت و اپلیکیشن", 290], ["سایر", 275]]};let DATA=[];document.getElementById('themes').innerHTML=META.themes.map(x=>`<p>${x[0]} — ${x[1].toLocaleString('fa')}<span class="bar" style="display:block;width:${100*x[1]/META.themes[0][1]}%"></span></p>`).join('');function parseCSV(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'){r.push(v);a.push(r);r=[];v=''}else if(c!=='\r')v+=c}return a}fetch('../cleaned/manifest.json').then(x=>x.json()).then(m=>Promise.all(m.parts.map(p=>fetch('../cleaned/'+p).then(x=>x.text())))).then(parts=>{let h=null;DATA=[];for(const t of parts){let a=parseCSV(t),head=a.shift();if(!h)h=head;DATA.push(...a.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||'']))))}filterRows()});function esc(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function filterRows(){let q=document.getElementById('q').value.trim(),s=document.getElementById('s').value;let x=DATA.filter(r=>(!q||(r['متن کامنت']||'').includes(q))&&(!s||r['احساس نظر']===s));document.getElementById('count').textContent=x.length.toLocaleString('fa');document.getElementById('body').innerHTML=x.slice(0,200).map(r=>`<tr><td>${esc(r['نام محصول'])}</td><td>${esc(r['متن کامنت'])}</td><td>${esc(r['احساس نظر'])}</td><td>${esc(r['دسته اصلی'])}</td></tr>`).join('')}</script></html>
